# Paket güncellemeleri: uyumlu küçük güncellemeler birlikte, bağlı paketler ayrı gruplarda yükseltilir.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-kucuk-guncellemeler:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pub
    directory: "/mobile"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "connectivity_plus"
        versions: ["7.3.2"]
      - dependency-name: "flutter_local_notifications"
        versions: [">=23.0.0-dev.0 <23.0.0"]
    groups:
      flutter-kucuk-guncellemeler:
        patterns: ["*"]
        exclude-patterns: ["flutter_local_notifications", "connectivity_plus", "flutter_map", "latlong2", "proj4dart", "firebase_core", "firebase_messaging"]
        update-types: ["minor", "patch"]
      flutter-firebase:
        patterns: ["firebase_core", "firebase_messaging"]
        update-types: ["minor", "patch"]
      flutter-harita:
        patterns: ["flutter_map", "latlong2", "proj4dart"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
