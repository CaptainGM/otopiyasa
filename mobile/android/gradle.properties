org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Proje yolu Türkçe karakter içeriyor ("Masaüstü") ve Gradle bunu hata sayıp
# derlemeyi kesiyor. Uyarının işaret ettiği sorun (bazı araçların yolu yanlış
# çözmesi) bu projede yaşanmıyor; kontrolü kapatıyoruz.
android.overridePathCheck=true

# Sistemdeki varsayılan Java (PATH'teki) JDK 26 — Gradle 8.14 / Android Gradle
# Plugin 8.11.1 bu kadar yeni bir JDK'yı henüz desteklemiyor ("Unsupported
# class file major version 69" hatası buradan geliyor). Android Studio zaten
# uyumlu bir JDK 21 (JBR) ile geliyor; Gradle'ı sistem Java'sı yerine ona
# yönlendiriyoruz. Yol Android Studio'nun kurulu olduğu yere göre değişebilir.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
