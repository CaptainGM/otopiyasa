name: Render Keepalive Warmup

on:
  schedule:
    # Her 10 dakikada bir çalışarak Render ücretsiz sunucusunun uyumasını (cold start 30-40 sn) engeller
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping OtoPiyasa
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send keepalive ping
        run: |
          curl -s -f -m 25 https://otopiyasa.app/api/ping || true

