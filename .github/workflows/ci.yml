name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Web (tip kontrolü + testler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - run: npm ci --ignore-scripts
      - name: TypeScript kontrolü
        run: npx tsc --noEmit
      - name: Birim testleri
        run: npm test

  mobile:
    name: Mobil (Flutter analiz + testler)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
