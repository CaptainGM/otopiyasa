# Dependabot'un açtığı paket güncellemesi isteği, CI başarıyla bittikten sonra kendiliğinden birleştirilir.
# CI kırmızıysa istek açık kalır ve GitHub e-posta ile haber verir.
name: Dependabot otomatik birlestirme

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Istegi birlestir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then echo "Acik istek yok"; exit 0; fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
